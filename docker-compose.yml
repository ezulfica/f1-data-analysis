services:

  floci:
    image: floci/floci:latest
    ports:
      - "4566:4566"
    environment:
      - AWS_DEFAULT_REGION=eu-west-3
    volumes:
      - floci-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  floci-init:
    image: amazon/aws-cli:latest
    depends_on:
      floci:
        condition: service_healthy
    environment:
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=eu-west-3
    entrypoint: >
      /bin/sh -c "
      aws --endpoint-url=http://floci:4566 s3 mb s3://ezu-f1-data --region eu-west-3 || true &&
      echo 'Bucket ezu-f1-data ready.'
      "

volumes:
  floci-data:
