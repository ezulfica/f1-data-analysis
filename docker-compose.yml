services:

  floci:
    image: floci/floci:latest
    ports:
      - "4566:4566"
    environment:
      - AWS_DEFAULT_REGION=eu-west-3
    networks:
      - f1-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  floci-init:
    image: amazon/aws-cli:latest
    depends_on:
      floci:
        condition: service_healthy
    environment:
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=eu-west-3
    entrypoint: >
      /bin/sh -c "
      aws --endpoint-url=http://floci:4566 s3 mb s3://ezu-f1-data --region eu-west-3 || true &&
      echo 'Bucket ezu-f1-data ready.'
      "
    networks:
      - f1-network

  airflow:
    build: .
    depends_on:
      floci:
        condition: service_healthy
    env_file:
      - config/.env.local
    environment:
      - S3_ENDPOINT_URL=http://floci:4566
      - DBT_TARGET=local
      - DBT_PROFILES_DIR=/app/local/dbt
    ports:
      - "9090:9090"
    volumes:
      - ./dbt_projects:/app/dbt_projects
      - ./local/dbt:/app/local/dbt
      - ./local/duckdb:/app/duckdb
    networks:
      - f1-network

networks:
  f1-network:
    driver: bridge
