[project]
name = "f1-data-collection"
version = "0.1.0"
description = ""
requires-python = ">=3.10,<3.12"
dependencies = [
    "requests>=2.32.3",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.2",
    "polars>=1.20.0",
    "aiohttp>=3.11.11",
    "boto3>=1.36.2",
    "numpy>=2.2.2",
    "pandas>=2.2.3",
    "pyarrow>=19.0.0",
    "tqdm>=4.67.1",
    "google-cloud-bigquery>=3.29.0",
    "dbt-bigquery>=1.9.1",
    "dbt-duckdb>=1.9.0",
    "apache-airflow>=2.10.5",
]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
]

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
